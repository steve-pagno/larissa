<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/main.js" defer></script>
    <title>Contato | Estúdio Domme</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <domme-header></domme-header>

    <main>
        <section>
            <h2 class="titulo-secao">Fale com o Estúdio</h2>
            
            <div class="contato-container">
                <div class="contato-info">
                    <div>
                        <h3>Showroom Principal</h3>
                        <p>Av. das Nações Unidas, 12345</p>
                        <p>São Paulo, SP - 04578-000</p>
                    </div>
                    <div>
                        <h3>Atendimento</h3>
                        <p>contato@email.com</p>
                        <p>+55 11 99999-0000</p>
                    </div>
                    <div>
                        <h3>Horário</h3>
                        <p>Segunda a Sexta: 10h às 19h</p>
                        <p>Sábado: 10h às 14h</p>
                    </div>
                </div>

                <form class="contato-form">
                    <div style="display: flex; gap: 20px;">
                        <input type="text" placeholder="Nome Completo" required>
                        <input type="text" placeholder="Empresa / Escritório (Opcional)">
                    </div>
                    <div style="display: flex; gap: 20px;">
                        <input type="email" placeholder="E-mail" required>
                        <input type="tel" placeholder="Telefone / WhatsApp">
                    </div>
                    <textarea rows="6" placeholder="Como podemos ajudar? (Orçamentos, parcerias, dúvidas de especificação)" required></textarea>
                    <button type="submit" class="btn" style="align-self: flex-start;">Enviar Solicitação</button>
                </form>

            </div>
        </section>

        <section style="padding-top: 0;">
            <div class="img-placeholder" style="height: 400px; border-radius: 4px;">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d56531.22255501468!2d-48.524643443127445!3d-27.68016921213486!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95273a0c515d75f7%3A0xa78ef5ed13a752e5!2sAeroporto%20Internacional%20de%20Florian%C3%B3polis%20-%20Herc%C3%ADlio%20Luz!5e0!3m2!1spt-BR!2sbr!4v1771862486813!5m2!1spt-BR!2sbr" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </section>
    </main>

    <domme-footer></domme-footer>

</body>
</html>
