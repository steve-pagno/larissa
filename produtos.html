<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/main.js" defer></script>
    <title>Lançamentos | Estúdio Domme</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <domme-header></domme-header>

    <main>
        <section class="secao-lancamento-full">
            <div class="lancamento-container-full">

                <div class="lancamento-imagem-full">
                    <img src="img/images.jpg" alt="IMA Collection 2627">
                </div>

                <div class="lancamento-texto-full">
                    <div class="texto-wrapper-full">
                        <h2 class="lancamento-titulo">Produtos</h2>
                        <p class="lancamento-descricao">
                            Explore a diversidade da América Móveis. Descubra nossa linha completa, desde móveis premium até opções personalizadas. Encontre a peça ideal para transformar e inovar seu espaço, unindo conforto, design e durabilidade.
                        </p>
                    </div>
                </div>

            </div>
        </section>

        <section class="secao-grade-produtos">
            <div class="grade-container">

                <a href="pagina-produto.html" class="produto-item-mini">
                    <div class="produto-img-mini">
                        <img src="img/vik-banqueta.jpg" alt="Banqueta Vik">
                    </div>
                    <span class="produto-nome-mini">Vik</span>
                </a>

                <a href="pagina-produto.html" class="produto-item-mini">
                    <div class="produto-img-mini">
                        <img src="img/vik-poltrona.jpg" alt="Poltrona Vik">
                    </div>
                    <span class="produto-nome-mini">Vik</span>
                </a>

                <a href="pagina-produto.html" class="produto-item-mini">
                    <div class="produto-img-mini">
                        <img src="img/vai-vem.jpg" alt="Cadeira Vai-Vem">
                    </div>
                    <span class="produto-nome-mini">Vai-Vem</span>
                </a>

                <a href="pagina-produto.html" class="produto-item-mini">
                    <div class="produto-img-mini">
                        <img src="img/solta.jpg" alt="Cadeira Solta">
                    </div>
                    <span class="produto-nome-mini">Solta</span>
                </a>

            </div>
        </section>
    </main>

    <domme-footer></domme-footer>

</body>

</html>
