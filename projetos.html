<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/main.js" defer></script>
    <title>Projetos | Estúdio Domme</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <domme-header></domme-header>

    <main>
        <section class="secao-lancamento-full">
            <div class="lancamento-container-full">
                <div class="lancamento-imagem-full">
                    <img src="img/textura.jpg" alt="Portfolio Estúdio Domme">
                </div>
                <div class="lancamento-texto-full">
                    <div class="texto-wrapper-full">
                        <h2 class="lancamento-titulo">Nossos Projetos</h2>
                        <p class="lancamento-descricao">
                            Explore como o design do Estúdio Domme se integra em ambientes residenciais e corporativos de alto padrão. Cada projeto é uma celebração da marcenaria fina e do mobiliário autoral.
                        </p>
                    </div>
                </div>
            </div>
        </section>

        <section class="secao-grade-produtos">
            <div class="grade-container">
                <a href="#" class="produto-item-mini">
                    <div class="produto-img-mini">
                        <img src="img/marcenaria.jpg" alt="Residência SP">
                    </div>
                    <span class="produto-nome-mini">Apartamento Ibirapuera</span>
                </a>
                <a href="#" class="produto-item-mini">
                    <div class="produto-img-mini">
                        <img src="img/images.jpg" alt="Escritório Design">
                    </div>
                    <span class="produto-nome-mini">Escritório Central</span>
                </a>
                </div>
        </section>
    </main>

    <domme-footer></domme-footer>
</body>
</html>
