<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/main.js" defer></script>
    <title>Vídeos | Estúdio Domme</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <domme-header></domme-header>

    <main>
        <section class="secao-grade-produtos">
            <h2 class="titulo-secao">Vídeos e Bastidores</h2>
            <div class="grade-container">
                
                <div class="produto-item-mini">
                    <div class="produto-img-mini" style="position: relative; background: #000;">
                        <img src="img/marcenaria.jpg" alt="Making of" style="opacity: 0.6;">
                        <i class="fa-solid fa-circle-play" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 3rem; cursor: pointer;"></i>
                    </div>
                    <span class="produto-nome-mini">Processo Criativo: Marcenaria</span>
                </div>

                <div class="produto-item-mini">
                    <div class="produto-img-mini" style="position: relative; background: #000;">
                        <img src="img/1.jpg" alt="Entrevista">
                        <i class="fa-solid fa-circle-play" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 3rem; cursor: pointer;"></i>
                    </div>
                    <span class="produto-nome-mini">Entrevista com Designers</span>
                </div>

            </div>
        </section>
    </main>

    <domme-footer></domme-footer>
</body>
</html>
